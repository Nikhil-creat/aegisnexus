name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: pip install -r backend/requirements-ci.txt
      - run: python -m pytest -q
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the site scripts
        run: |
          for f in docs/assets/*.js; do node --check "$f"; done
          python3 - <<'PY'
          import re
          html = open("docs/console.html").read()
          open("/tmp/console.js", "w").write(re.search(r"<script>(.*?)</script>", html, re.S).group(1))
          PY
          node --check /tmp/console.js

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (trains the CNNs during the build)
        run: docker build --build-arg TRAIN_EPOCHS=2 --build-arg TRAIN_SAMPLES=60 -t aegisnexus-api ./backend
      - name: Scan the image for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: aegisnexus-api
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
